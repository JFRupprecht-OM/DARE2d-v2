[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-dare2d"
version = "0.1.0"
description = "napari plugin to run DARE2D cell-division detection and overlay the results"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Framework :: napari",
    "License :: OSI Approved :: MIT License",
]
# IMPORTANT: dependencies are intentionally EMPTY. This plugin runs inside the
# version-pinned DARE2D env (numpy 1.23.5 is the pivot: TF 2.12 forbids numpy>=1.24 and
# the shipped napari is 0.4.18, which does not work on numpy 2). Listing napari/numpy/etc.
# here would let `pip install -e .` re-resolve and silently pull numpy>=2, breaking
# napari 0.4.18 and TensorFlow. Keep this empty; install runtime deps into the env
# explicitly and always with `-c constraints.txt` (repo root) — see README.md.
dependencies = []

[project.entry-points."napari.manifest"]
napari-dare2d = "napari_dare2d:napari.yaml"

[tool.setuptools]
packages = ["napari_dare2d"]

[tool.setuptools.package-data]
napari_dare2d = ["napari.yaml"]
